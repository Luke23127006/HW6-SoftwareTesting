name: HW06 API Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Collection scope to execute
        required: true
        default: full
        type: choice
        options:
          - full
          - demo

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Install SUT dependencies
        working-directory: ./eshop-sut/backend
        run: npm ci

      - name: Start SUT
        working-directory: ./eshop-sut/backend
        run: |
          node server.js > ../../sut.log 2>&1 &

      - name: Wait for SUT
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3000/api/products > /dev/null; then
              echo "SUT is ready"
              exit 0
            fi

            echo "Waiting for SUT... ($i/30)"
            sleep 2
          done

          echo "SUT did not become ready"
          cat sut.log || true
          exit 1

      - name: Prepare deterministic test fixtures
        run: node postman/data/prepare_fixtures.js

      - name: Select collection scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.suite }}" = "demo" ]; then
            echo "NEWMAN_COLLECTION=postman/HW06.ci-demonstration.postman_collection.json" >> "$GITHUB_ENV"
            echo "Running the transparent CI demonstration subset. This is not a full-suite pass."
          else
            echo "NEWMAN_COLLECTION=postman/HW06.postman_collection.json" >> "$GITHUB_ENV"
            echo "Running the authoritative full defect-detection suite."
          fi

      - name: Run Newman
        run: |
          mkdir -p reports/newman

          newman run "$NEWMAN_COLLECTION" \
            -e postman/local.postman_environment.json \
            -r cli,json,htmlextra \
            --reporter-json-export reports/newman/report.json \
            --reporter-htmlextra-export reports/newman/report.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/newman/
